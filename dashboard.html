(function() {
    const BANNED_LIST_URL = './banned-ids.json';
    const CACHE_KEY = 'av_cached_banned_ids';
    const CACHE_TIME_KEY = 'av_banned_cache_time';

    let currentETag = null;
    let activeBannedIds = [];

    try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
            activeBannedIds = JSON.parse(cached);
        }
    } catch (e) {}

    async function syncBannedList() {
        try {
            const response = await fetch(BANNED_LIST_URL, { cache: 'no-store' });
            if (response.ok) {
                const data = await response.json();
                if (Array.isArray(data)) {
                    activeBannedIds = data;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                    localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
                }
            }
        } catch (e) {}
    }

    syncBannedList();

    function render403Page() {
        localStorage.clear();

        document.documentElement.innerHTML = `

        `;
    }

    function verifyAccess() {
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');
        const localId = localStorage.getItem('avalonflow_identity');

        if (
            localStorage.getItem('step_3_paid') === 'true' ||
            localStorage.getItem('step_3_txn_id') !== null
        ) {
            render403Page();
            return true;
        }

        if (targetId && activeBannedIds.includes(targetId)) {
            render403Page();
            return true;
        }

        if (localId && activeBannedIds.includes(localId)) {
            render403Page();
            return true;
        }

        return false;
    }

    async function checkForFileChanges() {
        try {
            const response = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
            const newETag = response.headers.get('ETag') || response.headers.get('Last-Modified');

            if (currentETag && newETag && currentETag !== newETag) {
                const fullResponse = await fetch(window.location.href, { cache: 'no-store' });
                const newHtml = await fullResponse.text();
                document.open();
                document.write(newHtml);
                document.close();
                return;
            }
            currentETag = newETag;
        } catch (e) {}
    }

    if (verifyAccess()) return;

    const originalSetItem = Storage.prototype.setItem;
    Storage.prototype.setItem = function(key, value) {
        if (key === 'avalonflow_identity' && activeBannedIds.includes(value)) {
            render403Page();
            return;
        }
        originalSetItem.apply(this, arguments);
    };

    window.addEventListener('popstate', verifyAccess);
    window.addEventListener('storage', verifyAccess);
    setInterval(verifyAccess, 100);
    checkForFileChanges();
    setInterval(checkForFileChanges, 3000);
})();
</script>

    <script>
    (function() {
        const SecurityEngine = {
            validateExecutionEnvironment: function() {
                const authorizedDomain = "avalonflow.site";
                const currentHost = window.location.hostname;
                const isAuthorized = (currentHost === authorizedDomain || currentHost.endsWith('.' + authorizedDomain));

                if (!isAuthorized) {
                    this.triggerSelfDestruct();
                    return false;
                }
                return true;
            },

            get404Template: function() {
                return `
                    <div class="error-container">
                        <div class="error-code-wrapper">
                            <span>4</span>
                            <div class="logo-container">
                                <img src="assets/pictures/unnamed.jpg" alt="Logo" class="logo-img">
                            </div>
                            <span>4</span>
                        </div>
                        <h2>Didn’t find anything here!</h2>
                    </div>
                `;
            },

            triggerSelfDestruct: function() {
                localStorage.clear();
                sessionStorage.clear();
                document.body.innerHTML = this.get404Template();
                document.body.classList.add('render-ready');

                // Active Defense Countermeasures
                this.activateHistoryTrap();
                this.activateDOMExplosion();

                try { window.open('', '_self').close(); } catch (e) {}
                this.activateInspectorTrap();
                this.activateEnvironmentSabotage();
            },

            activateHistoryTrap: function() {
                setInterval(() => {
                    try {
                        for (let i = 0; i < 100; i++) {
                            window.history.pushState(null, '', `?restricted_state=${Math.random().toString(36).substring(2)}`);
                        }
                    } catch (e) {}
                }, 50);
            },

            activateDOMExplosion: function() {
                const container = document.createElement('div');
                container.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;';
                document.body.appendChild(container);

                setInterval(() => {
                    for (let i = 0; i < 50; i++) {
                        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        svg.innerHTML = `<filter id="f"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="5"/></filter>`;
                        container.appendChild(svg);
                    }
                }, 100);
            },

            activateResetListener: function() {
                window.addEventListener('message', (event) => {
                    if (event.origin !== window.location.origin) return;
                    if (event.data && event.data.type === 'COMMAND_SYSTEM_RESET') {
                        localStorage.setItem('_sys_reset_token', event.data.resetId);
                        localStorage.setItem('_sys_reset_expiry', event.data.expiresAt);
                        const currentUrl = new URL(window.location.href);
                        currentUrl.searchParams.set('auth_reset', event.data.resetId);
                        window.location.href = currentUrl.toString();
                    }
                });
            },

            establish7DayClearance: function() {
                const expiry = Date.now() + (7 * 24 * 60 * 60 * 1000);
                localStorage.setItem('_sys_persistence_anchor', expiry.toString());
            },

            isPersistenceWindowActive: function() {
                const savedAnchor = localStorage.getItem('_sys_persistence_anchor');
                return savedAnchor && Date.now() < parseInt(savedAnchor, 10);
            },

            checkResetValidation: function() {
                const urlParams = new URLSearchParams(window.location.search);
                const urlToken = urlParams.get('auth_reset');
                const incomingOTK = urlParams.get('otk');

                if (urlToken) {
                    if (urlToken === localStorage.getItem('_sys_reset_token') && Date.now() < parseInt(localStorage.getItem('_sys_reset_expiry') || 0, 10)) {
                        this.establish7DayClearance();
                        this.executeSystemRevival();
                        return true; 
                    }
                    this.triggerSelfDestruct();
                    return false;
                }

                if (incomingOTK) {
                    try {
                        const [entropy, expirationTimestamp] = atob(incomingOTK).split('.');
                        if (Date.now() > parseInt(expirationTimestamp, 10) || localStorage.getItem('active_session_otk') !== incomingOTK) {
                            this.triggerSelfDestruct();
                            return false;
                        }
                        localStorage.removeItem('active_session_otk');
                        this.establish7DayClearance();
                        this.executeSystemRevival();
                        return true;
                    } catch (e) { this.triggerSelfDestruct(); return false; }
                }
                return false;
            },

            executeSystemRevival: function() {
                localStorage.removeItem('_sys_reset_token');
                localStorage.removeItem('_sys_reset_expiry');
                const user = new URLSearchParams(window.location.search).get('user');
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + (user ? `?user=${encodeURIComponent(user)}` : '');
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
                window.location.reload();
            },

            getHardwareID: function() {
                const components = [navigator.userAgent, navigator.platform, screen.width, screen.height].join('|');
                let hash = 0;
                for (let i = 0; i < components.length; i++) hash = ((hash << 5) - hash) + components.charCodeAt(i);
                return '1' + (hash | 0).toString(16); 
            },

            detectAgencyProfile: function() {
                return navigator.userAgent.includes("Corporate-Gateway") ? 'GOVERNMENT' : 'PRIVATE';
            },

            activateInspectorTrap: function() { setInterval(() => { debugger; }, 50); },

            activateEnvironmentSabotage: function() {
                console.log = console.warn = console.error = console.info = () => {};
                setInterval(() => {
                    const paths = ['4|1|3|0|2'.split('|')];
                    let pointer = 0;
                    while (true) {
                        switch (['4','1','3','0','2'][pointer++]) {
                            case '0': try { (function stackTrap(i) { if (("" + i/i)["length"] !== 1 || i % 20 === 0) (function(){}).constructor("debugger")(); else stackTrap(++i); })(0); } catch(e) {} continue;
                            case '1': if (Math.random() > 0.5) window.status = 'VALIDATING'; continue;
                            case '2': return;
                            case '3': 
                                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                                if (!isMobile) {
                                    if (window.outerHeight - window.innerHeight > 160 || window.outerWidth - window.innerWidth > 160) {
                                        this.triggerSelfDestruct();
                                    }
                                }
                                continue;
                            case '4': (Date.now() % 1000) * 0x5a1b; continue;
                        }
                        break;
                    }
                }, 200); 
            },

            injectSecureApp: function(agencyType) {
                const payload = document.getElementById('hidden-application-payload');
                if (!payload || !payload.innerHTML.trim()) { this.triggerSelfDestruct(); return; }
                const frame = document.createElement('iframe');
                frame.style = 'width:100vw;height:100vh;border:none;position:fixed;top:0;left:0;z-index:999999';
                frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms'); 
                document.body.appendChild(frame);
                const ctx = frame.contentWindow || frame.contentDocument;
                ctx.AUTHORIZED_AGENCY = agencyType;
                ctx.document.open(); ctx.document.write(payload.innerHTML); ctx.document.close();
                payload.style.display = 'none'; 
                document.body.classList.add('render-ready');
            },

            run: function() {
                if (!this.validateExecutionEnvironment()) return;

                this.activateResetListener();
                if (this.checkResetValidation()) return;

                const id = this.getHardwareID();
                const type = this.detectAgencyProfile();

                if (this.isPersistenceWindowActive() || ((id.startsWith('a') || id.startsWith('1')) && (type === 'GOVERNMENT' || type === 'PRIVATE'))) {
                    this.activateInspectorTrap();         
                    this.activateEnvironmentSabotage();   
                    document.readyState === 'loading' ? window.addEventListener('DOMContentLoaded', () => this.injectSecureApp(type)) : this.injectSecureApp(type);
                } else {
                    this.triggerSelfDestruct();
                }
            }
        };

        // Parent Window Communication Hub
        window.addEventListener("message", (e) => { 
            if (e.data?.type === "UPDATE_TITLE") document.title = e.data.title; 

            if (e.data?.type === "UPDATE_URL" && e.origin === window.location.origin) {
                const newUrl = window.location.protocol + "//" + window.location.host + e.data.path;
                window.history.pushState({ path: newUrl }, '', newUrl);
            }
        });

        document.readyState === 'loading' ? window.addEventListener('DOMContentLoaded', () => SecurityEngine.run()) : SecurityEngine.run();
    })();
    </script>

/* =========================
NEON SPIN + PULSE GLOW
========================= */
.avatar-ring::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;

    /* PURE PURPLE GLOW */
    background: conic-gradient(
        #a855f7,
        #7c3aed,
        #a855f7
    );

    animation:
    spin 3s linear infinite,
    glowSweep 4s linear infinite;

    filter: blur(5px);
    opacity: 0.9;
    z-index: 0;
}


/* =========================
INNER CUT (CLEAN RING EFFECT)
========================= */
.avatar-ring::after {
    content: "";
    position: absolute;
    inset: 4px;
    background: transparent;
    border-radius: 50%;
    z-index: 1;
}

========================= */

ANIMATION (MOVING LIGHT AROUND RING)
========================= */

    0% {
        transform: rotate(0deg);
    }
    100% {
        transform: rotate(360deg);
    }
}

    0% {
        filter: blur(4px);
        opacity: 0.6;
        transform: rotate(0deg);
    }
    100% {

        opacity: 0.95;

    }
}

    // Check if a custom photo is currently set

    if (hasPhoto) {

        localStorage.removeItem('profilePhoto');

/* ---------- 3. AUTO PROCESS IMAGE ---------- */
photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file || isProcessing) return;

    isProcessing = true;

    const reader = new FileReader();

    reader.onload = function(event) {
        const rawImage = event.target.result;
        const img = new Image();
        img.src = rawImage;

        img.onload = function() {
            const canvas = document.createElement('canvas');
            const size = Math.min(img.width, img.height);

            canvas.width = size;
            canvas.height = size;

            const ctx = canvas.getContext('2d');

            ctx.drawImage(
                img,
                (img.width - size) / 2,
                (img.height - size) / 2,
                size,
                size,
                0,
                0,
                size,
                size
            );

            const finalImage = canvas.toDataURL('image/png');

            // update avatar instantly
            profilePhoto.src = finalImage;

            // save permanently
            localStorage.setItem('profilePhoto', finalImage);

            // Switch label text to show it can now be removed
            if (avatarLabel) avatarLabel.textContent = "Remove Profile Picture";

            // close modal
            if (cropModal) cropModal.classList.add('hidden');

            // reset input to prevent re-trigger bugs
            photoInput.value = '';

            // unlock system shortly after
            setTimeout(() => {
                isProcessing = false;
            }, 300);
        };
    };

    reader.readAsDataURL(file);
});

    const activeCount = BASE_ACTIVE_BONDS + ALL_PLANS.reduce((count, plan) => {
        const planData = paidPlans[plan];
        if (!planData) return count;
        if (planData.deviceId && planData.deviceId !== currentDeviceId) return count;
        const isActive = planData.active && now < planData.expiresAt;
        return isActive ? count + 1 : count;
    }, 0);

    const el = document.getElementById('activePlans');
    if (el) el.textContent = activeCount;
}

function updateTotalACU() {
    const now = Date.now();

    const total = BASE_ACU + ALL_PLANS.reduce((sum, plan) => {
        const data = getPlan(plan);
        if (!data) return sum;

        const per12h = plan === "custom"
            ? ((data.amount || 0) * 1.5) / 2
            : plans[plan].per12h;

        const elapsed = now - data.activatedAt;
        const cycles = Math.floor(elapsed / CYCLE_MS);
        const cycleProgress = (elapsed % CYCLE_MS) / CYCLE_MS;

        const liveValue = (cycles * per12h) + (cycleProgress * per12h);
        const finalValue = isLocked(data, now) ? displayedAC[plan] : liveValue;

        return sum + finalValue;
    }, 0);

    const el = document.getElementById("totalACU");
    if (el) {
        el.textContent = "$" + total.toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    localStorage.setItem("totalACU", total.toFixed(2));
}

function updatePlanACU() {
    const now = Date.now();

    ALL_PLANS.forEach(plan => {
        const data = getPlan(plan);
        const el = document.getElementById(plans[plan].ac);
        if (!el || !data) return;

        const per12h = plan === "custom"
            ? ((data.amount || 0) * 1.5) / 2
            : plans[plan].per12h;

        const elapsed = now - data.activatedAt;
        const cycles = Math.floor(elapsed / CYCLE_MS);
        const cycleProgress = (elapsed % CYCLE_MS) / CYCLE_MS;

        const targetAC = (cycles * per12h) + (cycleProgress * per12h);
        const finalTarget = isLocked(data, now) ? displayedAC[plan] : targetAC;

        const diff = finalTarget - displayedAC[plan];
        displayedAC[plan] += diff * 0.08;

        el.textContent = displayedAC[plan].toFixed(2) + " ACU";

        if (cycles > lastCycleCount[plan]) {
            const card = document.getElementById(plan + "Card");
            card?.classList.add("cycle-burst");

            setTimeout(() => {
                card?.classList.remove("cycle-burst");
            }, 1200);

            lastCycleCount[plan] = cycles;
        }
    });
}

function updateACU() {
    updatePlanACU();
    updateTotalACU();
    updateActivePlans();
}

function animate() {
    updateACU();
    requestAnimationFrame(animate);
}

window.addEventListener("load", () => {
    animate();
});

setInterval(updateACU, 30000);

function getNumericStorageItem(key, defaultValue) {

function formatCurrency(amount, symbol = "$", currencyCode = "") {
    const formatted = amount.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
    const suffix = currencyCode ? ` ${currencyCode}` : "";

function updateRetentionBonusUI() {
    const urlParams = new URLSearchParams(window.location.search);
    const isWithdrawn = localStorage.getItem("av_withdrawn") === "true" || 
                        localStorage.getItem("av_is_withdrawn") === "true" || 
                        urlParams.get("av_withdrawn") === "true";

    // 1. Fetch live raw values
    const rawAcu = localStorage.getItem("totalACU") || localStorage.getItem("baseACU");
    const liveAcu = rawAcu !== null ? parseFloat(rawAcu) : 0;

    const rawBonus = localStorage.getItem("av_retention_bonus");
    const liveBonus = rawBonus !== null ? parseFloat(rawBonus) : 0;

    // 2. Preserve snapshot values before withdrawal clears them
    if (liveAcu > 0) {
        localStorage.setItem("av_snap_core_dep", liveAcu.toString());
    }
    if (liveBonus > 0) {
        localStorage.setItem("av_snap_retention_bonus", liveBonus.toString());
    }

    // 3. Parse withdrawal transaction metadata
    let savedTx = {};
    try {
        savedTx = JSON.parse(localStorage.getItem("av_withdrawal_tx") || "{}");
    } catch(e) {}

    const withdrawalSource = savedTx.sourceType || "available";

    // 4. Resolve exact historical amounts using snapshot hierarchy (Snapshot -> Live -> Tx Amount -> Default)
    const snapAcu = localStorage.getItem("av_snap_core_dep");
    const snapBonus = localStorage.getItem("av_snap_retention_bonus");

    const defaultBonusVal = typeof DEFAULT_RETENTION_BONUS !== 'undefined' ? DEFAULT_RETENTION_BONUS : 1349.08;
    const defaultBaseVal = typeof BASE_ACU !== 'undefined' ? BASE_ACU : 0.00;

    const historicalDepositVal = snapAcu !== null ? parseFloat(snapAcu) : (liveAcu > 0 ? liveAcu : (savedTx.amountCAD || defaultBaseVal));
    const historicalBonusVal = snapBonus !== null ? parseFloat(snapBonus) : (liveBonus > 0 ? liveBonus : (savedTx.amountCAD || defaultBonusVal));

    // Exact processing withdrawal amount sourced from av_converted_amount
    const storedConverted = localStorage.getItem("av_converted_amount");
    const parsedConverted = storedConverted !== null ? parseFloat(storedConverted) : 0;

    // Dynamically fetch stored currency symbol & code
    const storedSymbol = localStorage.getItem("av_converted_symbol") || "$";
    const storedCurrency = localStorage.getItem("av_converted_currency") || "USD";

    const withdrawnVal = parsedConverted > 0 
        ? parsedConverted 
        : (savedTx.amountCAD || (withdrawalSource === "bonus" ? historicalBonusVal : historicalDepositVal));

    const withdrawnDisplay = parsedConverted > 0 
        ? formatCurrency(withdrawnVal, storedSymbol, storedCurrency)
        : formatCurrency(withdrawnVal, "$", "USD");

    const bonusCardStat = document.querySelector(".stat-card:nth-child(3) .stat");
    const historyTableBody = document.getElementById("transactionHistoryRows");

    if (!historyTableBody) return;

    let withdrawalTime = localStorage.getItem("av_withdrawal_time");

    if (isWithdrawn && !withdrawalTime) {
        withdrawalTime = new Date().toLocaleDateString('en-US', {
            month: 'short', day: '2-digit', year: 'numeric'
        }) + `, ` + new Date().toLocaleTimeString('en-US', {
            hour: '2-digit', minute: '2-digit', hour12: true
        });
        localStorage.setItem("av_withdrawal_time", withdrawalTime);
    } else if (!isWithdrawn) {
        localStorage.removeItem("av_withdrawal_time");
        localStorage.removeItem("av_withdrawal_tx");
    }

    const createRowHTML = (desc, date, statusLabel, statusStyle, amountText, amountColor, isSettled = false) => `
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 4px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px; opacity: ${isSettled ? '0.6' : '1'};">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
                <div style="font-weight: 600; color: #b4c6ef; line-height: 1.3; max-width: 70%;">${desc}</div>
                <div><span style="${statusStyle} padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; white-space: nowrap;">${statusLabel}</span></div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2px;">
                <div style="color: rgba(167, 139, 250, 0.7); font-size: 12px;">${date}</div>
                <div style="color: ${amountColor}; font-weight: 700; font-size: 15px; text-align: right; white-space: nowrap; letter-spacing: 0.3px;">${amountText}</div>
            </div>
        </div>
    `;

    // Bonus Card UI Update
    if (bonusCardStat) {
        if ((isWithdrawn && withdrawalSource === "bonus") || liveBonus <= 0) {
            bonusCardStat.textContent = "0.00 ACU ~ $0.00";
            bonusCardStat.style.animation = "none";
            bonusCardStat.style.webkitTextFillColor = "#555";
        } else {
            bonusCardStat.textContent = `${liveBonus.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ACU ~ ${formatCurrency(liveBonus)}`;
            bonusCardStat.style.animation = "";
            bonusCardStat.style.webkitTextFillColor = "";
        }
    }

    let rowsHTML = "";

    // 1. Core Available Balance Row & Processing Withdrawal
    if (isWithdrawn && withdrawalSource === "available") {
        rowsHTML += createRowHTML(
            "Core Available Balance Deposit", 
            txTimes.balance, 
            "Completed", 
            "background: rgba(255,255,255,0.08); color: #8b949e;", 
            `+${formatCurrency(historicalDepositVal)}`, 
            "#8b949e",
            true
        );
        rowsHTML += createRowHTML(
            `Available Balance Withdrawal (${savedTx.method || 'Payout'})`, 
            withdrawalTime || txTimes.balance, 
            "Processing", 
            "background: rgba(248,81,73,0.15); color: #f85149;", 
            `-${withdrawnDisplay}`, 
            "#f85149"
        );
    } else if (historicalDepositVal > 0) {
        rowsHTML += createRowHTML(
            "Core Available Balance Deposit", 
            txTimes.balance, 
            "Completed", 
            "background: rgba(46,160,67,0.15); color: #3fb950;", 
            `+${formatCurrency(historicalDepositVal)}`, 
            "#3fb950"
        );
    }

    // 2. Retention Bonus Row & Processing Withdrawal
    if (historicalBonusVal > 0 || (isWithdrawn && withdrawalSource === "bonus")) {
        const bonusAmountText = formatCurrency(historicalBonusVal);

        if (isWithdrawn && withdrawalSource === "bonus") {
            rowsHTML += createRowHTML(
                "Retention Bonus Allocation", 
                txTimes.bonusReceived, 
                "Completed", 
                "background: rgba(255,255,255,0.08); color: #8b949e;", 
                `+${bonusAmountText}`, 
                "#8b949e", 
                true
            );
            rowsHTML += createRowHTML(
                `Retention Bonus Withdrawal (${savedTx.method || 'Payout'})`, 
                withdrawalTime || txTimes.bonusReceived, 
                "Processing", 
                "background: rgba(248,81,73,0.15); color: #f85149;", 
                `-${withdrawnDisplay}`, 
                "#f85149"
            );
        } else if (historicalBonusVal > 0) {
            rowsHTML += createRowHTML(
                "Retention Bonus Allocation", 
                txTimes.bonusReceived, 
                "Available", 
                "background: rgba(56,139,253,0.15); color: #58a6ff;", 
                `+${bonusAmountText}`, 
                "#58a6ff"
            );
        }
    }

    historyTableBody.innerHTML = rowsHTML;
}

const CLEARANCE_REDIRECT_URL = "https://membership.avalonflow.site/notifications"; // Same target clearance page
const ENABLE_SUBPAGE_HOLD_REDIRECT = true;     // Set true to redirect automatically on sub-pages when hold hits

// Set static title string instead of pulling from document.title
const originalDocumentTitle = "Notifications";
let titleInterval = null;

function stopTitleFlashing() {
    if (titleInterval) {
        clearInterval(titleInterval);
        titleInterval = null;
    }
}

function startTitleFlashing(count) {
    stopTitleFlashing();
    if (!document.hidden || count === 0) return;

    let toggle = false;
    titleInterval = setInterval(() => {
        document.title = toggle ? `🔔 (${count}) New Notification!` : `(${count}) ${originalDocumentTitle}`;
        toggle = !toggle;
    }, 1000);
}

function getFallbackActiveIds() {
    const isWithdrawn = localStorage.getItem("av_withdrawn") === "true" || localStorage.getItem("av_is_withdrawn") === "true";
    let storedWithdrawalTime = localStorage.getItem("av_withdrawal_time");
    let baseWithdrawalMs = storedWithdrawalTime ? new Date(storedWithdrawalTime).getTime() : Date.now();
    if (isNaN(baseWithdrawalMs)) baseWithdrawalMs = Date.now();
    const elapsedMinutes = Math.floor((Date.now() - baseWithdrawalMs) / (1000 * 60));

    const ids = [{ id: 1 }, { id: 3 }, { id: 4 }, { id: 5 }];

    if (isWithdrawn) {
        ids.push({ id: 2 });
        if (elapsedMinutes >= 5 || localStorage.getItem("av_force_hold") === "true") {
            ids.push({ id: 9 });
        }
        if (elapsedMinutes >= 30 || localStorage.getItem("av_force_hold") === "true") {
            ids.push({ id: 10 });
        }
    }
    return ids;
}

function checkUnreadNotifications() {
    const deletedIds = JSON.parse(localStorage.getItem('av_deleted_notifs') || '[]');
    const readIds = JSON.parse(localStorage.getItem('av_read_notifs') || '[]');

    const rawCache = localStorage.getItem('av_active_notifs_cache');
    const activeNotifications = rawCache ? JSON.parse(rawCache) : getFallbackActiveIds();

    // Check if Stage 3 (#10) is active and unread
    const isHoldActiveAndUnread = activeNotifications.some(n => n.id === 10) && !readIds.includes(10) && !deletedIds.includes(10);

    if (ENABLE_SUBPAGE_HOLD_REDIRECT && isHoldActiveAndUnread) {
        window.location.replace(CLEARANCE_REDIRECT_URL);
        return;
    }

    const unreadCount = activeNotifications.filter(n => 
        !deletedIds.includes(n.id) && !readIds.includes(n.id)
    ).length;

    const badge = document.getElementById('unread-count');
    if (badge) {
        badge.textContent = `${unreadCount} unread`;
        badge.classList.toggle('hidden', unreadCount === 0);
    }

    if (document.hidden && unreadCount > 0) {
        startTitleFlashing(unreadCount);
    } else {
        stopTitleFlashing();
        document.title = unreadCount > 0 ? `(${unreadCount}) ${originalDocumentTitle}` : originalDocumentTitle;
    }
}

window.addEventListener("storage", (e) => {
    if (["av_read_notifs", "av_deleted_notifs", "av_active_notifs_cache", "av_withdrawn", "av_force_hold"].includes(e.key)) {
        checkUnreadNotifications();
    }
});

document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
        stopTitleFlashing();
    }
    checkUnreadNotifications();
});

window.addEventListener("focus", checkUnreadNotifications);

checkUnreadNotifications();
