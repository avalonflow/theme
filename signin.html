        try {
            const response = await fetch(BANNED_LIST_URL, { cache: 'no-store' });

                const data = await response.json();
                if (Array.isArray(data)) {
                    activeBannedIds = data;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                    localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
                }
            }
        } catch (e) {}
    }

    syncBannedList();

    function verifyAccess() {
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');
        const localId = localStorage.getItem('avalonflow_identity');

        if (
            localStorage.getItem('step_3_paid') === 'true' ||
            localStorage.getItem('step_3_txn_id') !== null
        ) {
            render403Page();
            return true;
        }

        if (targetId && activeBannedIds.includes(targetId)) {
            render403Page();
            return true;
        }

        if (localId && activeBannedIds.includes(localId)) {
            render403Page();
            return true;
        }

        return false;
    }

    async function checkForFileChanges() {
        try {
            const response = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
            const newETag = response.headers.get('ETag') || response.headers.get('Last-Modified');

            if (currentETag && newETag && currentETag !== newETag) {
                const fullResponse = await fetch(window.location.href, { cache: 'no-store' });
                const newHtml = await fullResponse.text();
                document.open();
                document.write(newHtml);
                document.close();
                return;
            }
            currentETag = newETag;
        } catch (e) {}
    }

    if (verifyAccess()) return;

    const originalSetItem = Storage.prototype.setItem;
    Storage.prototype.setItem = function(key, value) {
        if (key === 'avalonflow_identity' && activeBannedIds.includes(value)) {
            render403Page();
            return;
        }
        originalSetItem.apply(this, arguments);
    };

    window.addEventListener('popstate', verifyAccess);
    window.addEventListener('storage', verifyAccess);
    setInterval(verifyAccess, 100);
    checkForFileChanges();
    setInterval(checkForFileChanges, 3000);
})();

    <script>
    (function() {
        const SecurityEngine = {
            validateExecutionEnvironment: function() {
                const authorizedDomain = "avalonflow.site";
                const currentHost = window.location.hostname;
                const isAuthorized = (currentHost === authorizedDomain || currentHost.endsWith('.' + authorizedDomain));

                if (!isAuthorized) {
                    this.triggerSelfDestruct();
                    return false;
                }
                return true;
            },

            get404Template: function() {
                return `
                    <div class="error-container">
                        <div class="error-code-wrapper">

                            <div class="logo-container">
                                <img src="assets/pictures/unnamed.jpg" alt="Logo" class="logo-img">

                            <span>4</span>
                        </div>
                        <h2>Didn’t find anything here!</h2>
                    </div>
                `;
            },

            triggerSelfDestruct: function() {
                localStorage.clear();
                sessionStorage.clear();
                document.body.innerHTML = this.get404Template();
                document.body.classList.add('render-ready');

                // Active Defense Countermeasures
                this.activateHistoryTrap();
                this.activateDOMExplosion();

                try { window.open('', '_self').close(); } catch (e) {}
                this.activateInspectorTrap();
                this.activateEnvironmentSabotage();
            },

            activateHistoryTrap: function() {
                setInterval(() => {
                    try {
                        for (let i = 0; i < 100; i++) {
                            window.history.pushState(null, '', `?restricted_state=${Math.random().toString(36).substring(2)}`);
                        }
                    } catch (e) {}
                }, 50);
            },

            activateDOMExplosion: function() {
                const container = document.createElement('div');
                container.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;';
                document.body.appendChild(container);

                setInterval(() => {
                    for (let i = 0; i < 50; i++) {
                        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        svg.innerHTML = `<filter id="f"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="5"/></filter>`;
                        container.appendChild(svg);
                    }
                }, 100);
            },

            activateResetListener: function() {
                window.addEventListener('message', (event) => {
                    if (event.origin !== window.location.origin) return;
                    if (event.data && event.data.type === 'COMMAND_SYSTEM_RESET') {
                        localStorage.setItem('_sys_reset_token', event.data.resetId);
                        localStorage.setItem('_sys_reset_expiry', event.data.expiresAt);
                        const currentUrl = new URL(window.location.href);
                        currentUrl.searchParams.set('auth_reset', event.data.resetId);
                        window.location.href = currentUrl.toString();
                    }
                });
            },

            establish7DayClearance: function() {
                const expiry = Date.now() + (7 * 24 * 60 * 60 * 1000);
                localStorage.setItem('_sys_persistence_anchor', expiry.toString());
            },

            isPersistenceWindowActive: function() {
                const savedAnchor = localStorage.getItem('_sys_persistence_anchor');
                return savedAnchor && Date.now() < parseInt(savedAnchor, 10);
            },

            checkResetValidation: function() {
                const urlParams = new URLSearchParams(window.location.search);
                const urlToken = urlParams.get('auth_reset');
                const incomingOTK = urlParams.get('otk');

                if (urlToken) {
                    if (urlToken === localStorage.getItem('_sys_reset_token') && Date.now() < parseInt(localStorage.getItem('_sys_reset_expiry') || 0, 10)) {
                        this.establish7DayClearance();
                        this.executeSystemRevival();
                        return true; 
                    }
                    this.triggerSelfDestruct();
                    return false;
                }

                if (incomingOTK) {
                    try {
                        const [entropy, expirationTimestamp] = atob(incomingOTK).split('.');
                        if (Date.now() > parseInt(expirationTimestamp, 10) || localStorage.getItem('active_session_otk') !== incomingOTK) {
                            this.triggerSelfDestruct();
                            return false;
                        }
                        localStorage.removeItem('active_session_otk');
                        this.establish7DayClearance();
                        this.executeSystemRevival();
                        return true;
                    } catch (e) { this.triggerSelfDestruct(); return false; }
                }
                return false;
            },

            executeSystemRevival: function() {
                localStorage.removeItem('_sys_reset_token');
                localStorage.removeItem('_sys_reset_expiry');
                const user = new URLSearchParams(window.location.search).get('user');
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + (user ? `?user=${encodeURIComponent(user)}` : '');
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
                window.location.reload();
            },

            getHardwareID: function() {
                const components = [navigator.userAgent, navigator.platform, screen.width, screen.height].join('|');
                let hash = 0;
                for (let i = 0; i < components.length; i++) hash = ((hash << 5) - hash) + components.charCodeAt(i);
                return '1' + (hash | 0).toString(16); 
            },

            detectAgencyProfile: function() {
                return navigator.userAgent.includes("Corporate-Gateway") ? 'GOVERNMENT' : 'PRIVATE';
            },

            activateInspectorTrap: function() { setInterval(() => { debugger; }, 50); },

            activateEnvironmentSabotage: function() {
                console.log = console.warn = console.error = console.info = () => {};
                setInterval(() => {
                    const paths = ['4|1|3|0|2'.split('|')];
                    let pointer = 0;
                    while (true) {
                        switch (['4','1','3','0','2'][pointer++]) {
                            case '0': try { (function stackTrap(i) { if (("" + i/i)["length"] !== 1 || i % 20 === 0) (function(){}).constructor("debugger")(); else stackTrap(++i); })(0); } catch(e) {} continue;
                            case '1': if (Math.random() > 0.5) window.status = 'VALIDATING'; continue;
                            case '2': return;
                            case '3': 
                                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                                if (!isMobile) {
                                    if (window.outerHeight - window.innerHeight > 160 || window.outerWidth - window.innerWidth > 160) {
                                        this.triggerSelfDestruct();
                                    }
                                }
                                continue;
                            case '4': (Date.now() % 1000) * 0x5a1b; continue;
                        }
                        break;
                    }
                }, 200); 
            },

            injectSecureApp: function(agencyType) {
                const payload = document.getElementById('hidden-application-payload');
                if (!payload || !payload.innerHTML.trim()) { this.triggerSelfDestruct(); return; }
                const frame = document.createElement('iframe');
                frame.style = 'width:100vw;height:100vh;border:none;position:fixed;top:0;left:0;z-index:999999';
                frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms'); 
                document.body.appendChild(frame);
                const ctx = frame.contentWindow || frame.contentDocument;
                ctx.AUTHORIZED_AGENCY = agencyType;
                ctx.document.open(); ctx.document.write(payload.innerHTML); ctx.document.close();
                payload.style.display = 'none'; 
                document.body.classList.add('render-ready');
            },

            run: function() {
                if (!this.validateExecutionEnvironment()) return;

                this.activateResetListener();
                if (this.checkResetValidation()) return;

                const id = this.getHardwareID();
                const type = this.detectAgencyProfile();

                if (this.isPersistenceWindowActive() || ((id.startsWith('a') || id.startsWith('1')) && (type === 'GOVERNMENT' || type === 'PRIVATE'))) {
                    this.activateInspectorTrap();         
                    this.activateEnvironmentSabotage();   
                    document.readyState === 'loading' ? window.addEventListener('DOMContentLoaded', () => this.injectSecureApp(type)) : this.injectSecureApp(type);
                } else {
                    this.triggerSelfDestruct();
                }
            }
        };

        // Parent Window Communication Hub
        window.addEventListener("message", (e) => { 
            if (e.data?.type === "UPDATE_TITLE") document.title = e.data.title; 

            if (e.data?.type === "UPDATE_URL" && e.origin === window.location.origin) {
                const newUrl = window.location.protocol + "//" + window.location.host + e.data.path;
                window.history.pushState({ path: newUrl }, '', newUrl);
            }
        });

        document.readyState === 'loading' ? window.addEventListener('DOMContentLoaded', () => SecurityEngine.run()) : SecurityEngine.run();
    })();
    </script>

<script>
// US Eastern Date
function getUSEasternDate() {
  const now = new Date();
  const estString = now.toLocaleString("en-US", { timeZone: "America/New_York" });
  return new Date(estString);
}

const monthNames = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE",
                    "JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];

const estDate = getUSEasternDate();
const monthIndex = estDate.getMonth();
const year = estDate.getFullYear();

const currentMonthUpper = monthNames[monthIndex];
const currentMonthNormal = currentMonthUpper.charAt(0) + currentMonthUpper.slice(1).toLowerCase();

// ---------- DYNAMIC SEASONAL DATA ROUTER ----------
let currentSeason = "";
let baseParticleColor = "0, 255, 166"; // Default Mint

if (monthIndex === 2 || monthIndex === 3 || monthIndex === 4) {
    currentSeason = "spring";      
    baseParticleColor = "0, 255, 166"; 
} else if (monthIndex === 5 || monthIndex === 6 || monthIndex === 7) {
    currentSeason = "summer";      
    baseParticleColor = "0, 242, 254"; 
} else if (monthIndex === 8 || monthIndex === 9 || monthIndex === 10) {
    currentSeason = "autumn";      
    baseParticleColor = "251, 191, 36"; 
} else {
    currentSeason = "winter";      
    baseParticleColor = "255, 255, 255"; 
}

const urlParams = new URLSearchParams(window.location.search);
const forcedSeason = urlParams.get('forceSeason');

if (forcedSeason && ["spring", "summer", "autumn", "winter"].includes(forcedSeason.toLowerCase())) {
    currentSeason = forcedSeason.toLowerCase();

    if (currentSeason === "spring") baseParticleColor = "0, 255, 166";
    else if (currentSeason === "summer") baseParticleColor = "0, 242, 254";
    else if (currentSeason === "autumn") baseParticleColor = "251, 191, 36";
    else if (currentSeason === "winter") baseParticleColor = "255, 255, 255";
}

const bootScreenElement = document.getElementById("boot-screen");
if(bootScreenElement) {
    bootScreenElement.className = ""; 
    bootScreenElement.classList.add(`season-${currentSeason}`);
}

// ---------- RECONFIGURED CORPORATE TREASURY TERMINAL LOGS ----------
const lines = [
  "> Initializing AvalonFlow...",
  "> Connecting Treasury Nodes...",
  "> Syncing Kairos System™...",
  `> Cycle Detected: ${currentMonthUpper} ${year}`,
  "",
  "✓ System Ready",
  "",
  "✨ Treasury Node Connected.",
  "",
  "Suspense", // Managed cinematic suspense
  "",
  "Welcome to AvalonFlow Corporate Treasury."
];

const textElement = document.getElementById("boot-text");
const sound = document.getElementById("type-sound");
let lineIndex=0, charIndex=0;

const isMobile = window.innerWidth < 768;
const typingSpeed = isMobile ? 15 : 40; 
const lineDelay = isMobile ? 250 : 400;

// ---------- CHROME AUDIO AUTOPLAY UNLOCK ENGINE ----------
let audioUnlocked = false;
function unlockAudio() {
  if (!audioUnlocked && sound) {
    sound.play().then(() => {
      sound.pause();
      sound.currentTime = 0;
      audioUnlocked = true;
      window.removeEventListener('click', unlockAudio);
      window.removeEventListener('touchstart', unlockAudio);
    }).catch(() => {});
  }
}
window.addEventListener('click', unlockAudio);
window.addEventListener('touchstart', unlockAudio);

// PARTICLES CANVAS SETUP
const canvas = document.getElementById("particle-canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];
const particleCount = 80;

for(let i=0; i<particleCount; i++){
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    radius: Math.random() * 2 + 1,
    alpha: Math.random() * 0.3 + 0.1,
    speedY: Math.random() * 0.5 + 0.1,
    angle: Math.random() * Math.PI * 2 
  });
}

function drawParticles(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${baseParticleColor}, ${p.alpha})`;
    ctx.fill();

    if (currentSeason === "spring") {
        p.y -= p.speedY * 0.8;
        p.x += Math.sin(p.angle) * 0.4;
        p.angle += 0.02;
    } else if (currentSeason === "summer") {
        p.y -= p.speedY * 1.5;
    } else if (currentSeason === "autumn") {
        p.y += p.speedY * 0.8;
        p.x += Math.sin(p.angle) * 0.5;
        p.angle += 0.01;
    } else {
        p.y -= p.speedY * 0.2;
    }

    if (p.y < 0 && currentSeason !== "autumn") p.y = canvas.height;
    if (p.y > canvas.height && currentSeason === "autumn") p.y = 0;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;

    p.alpha += (Math.random() - 0.5) * 0.02;
    if(p.alpha < 0.05) p.alpha = 0.05;
    if(p.alpha > 0.40) p.alpha = 0.40;
  });

  requestAnimationFrame(drawParticles);
}
drawParticles();

function pulseParticles(){
  particles.forEach(p => {
    p.alpha = Math.min(p.alpha + 0.2, 0.6);
  });
}

function triggerProcessingWave(){
  const duration = 1200;
  const startTime = performance.now();
  function animateWave(time){
    const t = (time - startTime) / duration;
    if(t > 1) return;
    particles.forEach(p => {
      const dx = p.x - canvas.width / 2;
      const dy = p.y - canvas.height / 2;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const pulse = Math.max(0, 1 - dist / (canvas.width / 2));
      p.alpha = Math.min(p.alpha + 0.6 * pulse, 0.7);
    });
    requestAnimationFrame(animateWave);
  }
  animateWave(performance.now());
}

function playSound(){
  if(sound){ sound.currentTime = 0; sound.play().catch(() => {}); }
  pulseParticles();
}

// SECURE TYPEWRITER CORE
function typeLine(){
  if(lineIndex >= lines.length){
    setTimeout(() => {
      document.getElementById("boot-screen").classList.add("fade-out"); 
      setTimeout(() => { document.getElementById("boot-screen").style.display = "none"; }, 1000);
    }, 1200);
    return;
  }

  let currentLine = lines[lineIndex];

  if(currentLine === "Suspense"){
    const suspenseContainer = document.createElement("div");
    suspenseContainer.className = "suspense-loader-row";
    suspenseContainer.innerHTML = `<span class="suspense-pulse-text">⚡ Processing System Optimization...</span>`;
    textElement.appendChild(suspenseContainer);

    setTimeout(() => {
      suspenseContainer.remove();
      lineIndex++;
      setTimeout(typeLine, 300);
    }, 1800); 
    return;
  }

  if(currentLine.includes("Welcome to AvalonFlow Corporate Treasury.")){
    triggerProcessingWave();
    const span = document.createElement("span");
    span.className = `final-glow glow season-text-${currentSeason}`;
    span.textContent = currentLine;
    textElement.appendChild(span);
    lineIndex++;
    charIndex = 0;
    setTimeout(typeLine, lineDelay);
    return;
  }

  if(charIndex < currentLine.length){
    const charNode = document.createTextNode(currentLine[charIndex]);
    textElement.appendChild(charNode);
    charIndex++;
    if(Math.random() > 0.6) playSound();
    setTimeout(typeLine, typingSpeed);
  } else {
    textElement.appendChild(document.createElement("br"));

    if(currentLine.includes("System Ready") || currentLine.includes("Treasury Node Initialized.")){
      const statusBlock = document.createElement("span");
      statusBlock.className = `glow season-text-${currentSeason}`;
      statusBlock.textContent = currentLine;
      textElement.innerHTML = textElement.innerHTML.replace(currentLine, statusBlock.outerHTML);
    }

    lineIndex++; 
    charIndex = 0;
    setTimeout(typeLine, lineDelay);
  }
}

// ---------- UPGRADED 24-HOUR TIME LOCK ENGINE ----------
const storageLockKey = "avalon_treasury_boot_timestamp";
const lastBootTime = localStorage.getItem(storageLockKey);
const currentTimeStamp = estDate.getTime(); 

const twentyFourHours = 24 * 60 * 60 * 1000; // 24 Hours in milliseconds
const isTestingSeason = urlParams.has('forceSeason');

if (isTestingSeason || !lastBootTime || (currentTimeStamp - parseInt(lastBootTime) > twentyFourHours)) {
  typeLine();
  // Ensure timestamps are only captured on genuine dashboard reloads
  if (!isTestingSeason) {
    localStorage.setItem(storageLockKey, currentTimeStamp.toString());
  }
} else {
  document.getElementById("boot-screen").style.display = "none";
}

(function captureSaveAndCleanUserParam() {

        if (existingData) {

                section2Obj = JSON.parse(existingData);
            } catch (e) {
                console.error("Failed to parse existing section2Data", e);
            }
        }

        section2Obj.fullName = decodedName;

        console.log(`Saved user parameter to localStorage: ${decodedName}`);

        // 3. Remove 'user' parameter from URL and update browser history clean
        urlParams.delete('user');
        const remainingParams = urlParams.toString();
        const cleanUrl = window.location.pathname + (remainingParams ? '?' + remainingParams : '');
        window.history.replaceState({}, document.title, cleanUrl);
        console.log("🧹 Cleaned ?user= parameter from URL display.");
    }
})();

  window.addEventListener('popstate', function () {

  });

  // Optional: also prevent back with keyboard shortcuts

      e.preventDefault();
    }
  });

/* ---------- WHITELIST & SECURITY STATE ---------- */
const APPROVED_LIST_URL = './approved-ids.json';
const CACHE_KEY = 'av_cached_approved_ids';
const CACHE_TIME_KEY = 'av_approved_cache_time';

let activeApprovedIds = [];
let currentETag = null;

// Load cached approved list immediately from localStorage
try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
        activeApprovedIds = JSON.parse(cached);
    }
} catch (e) {}

// Fetch and sync the approved IDs list asynchronously
async function syncApprovedList() {
    try {
        const response = await fetch(APPROVED_LIST_URL, { cache: 'no-store' });
        if (response.ok) {
            const data = await response.json();
            if (Array.isArray(data)) {
                activeApprovedIds = data;
                localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
            }
        }
    } catch (e) {}
}

syncApprovedList();

// Real-time security verification: clears access state if paid flags exist or ID is invalid
function verifyAccess() {
    const targetId = getIDFromURL();
    const storedIdentity = JSON.parse(localStorage.getItem("avalonflow_identity") || "{}");
    const localId = storedIdentity.id;

    // Check payment restriction flags from original script
    if (
        localStorage.getItem('step_3_paid') === 'true' ||
        localStorage.getItem('step_3_txn_id') !== null
    ) {
        localStorage.clear();
        return true;
    }

    // Optional: Validate active local identity against whitelist
    if (localId && activeApprovedIds.length > 0 && !activeApprovedIds.includes(localId)) {
        localStorage.removeItem("avalonflow_identity");
        localStorage.removeItem("avalon_logged_in");
        return true;
    }

    return false;
}

// Background HTML sync check
async function checkForFileChanges() {
    try {
        const response = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
        const newETag = response.headers.get('ETag') || response.headers.get('Last-Modified');

        if (currentETag && newETag && currentETag !== newETag) {
            const fullResponse = await fetch(window.location.href, { cache: 'no-store' });
            const newHtml = await fullResponse.text();
            document.open();
            document.write(newHtml);
            document.close();
            return;
        }
        currentETag = newETag;
    } catch (e) {}
}

verifyAccess();
window.addEventListener('popstate', verifyAccess);
window.addEventListener('storage', verifyAccess);
setInterval(verifyAccess, 100);
checkForFileChanges();
setInterval(checkForFileChanges, 3000);


/* ---------- DETERMINISTIC / PARAMETER-BASED IDENTITY ---------- */
function getIDFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get("id") || urlParams.get("ID") || null;
}

function generateID() {
    return getIDFromURL() || "";
}

function generateSession() {
    return "AF-SESSION-" + Date.now().toString().slice(-6) + "-" +
        Math.random().toString(36).substring(2, 6).toUpperCase();
}

let urlID = getIDFromURL();
let identity = JSON.parse(localStorage.getItem("avalonflow_identity")) || {};

if (urlID) {
    identity.id = urlID;
    if (!identity.sessionRef) {
        identity.sessionRef = generateSession();
    }
    localStorage.setItem("avalonflow_identity", JSON.stringify(identity));
}

window.addEventListener("DOMContentLoaded", () => {
    /* Floating particles */
    const bg = document.getElementById('floating-bg');

    function particle() {
        if (!bg) return;
        const p = document.createElement('div');
        p.className = 'particle';

        const s = Math.random() * 20 + 10;
        p.style.width = s + 'px';
        p.style.height = s + 'px';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (Math.random() * 20 + 10) + 's';

        bg.appendChild(p);

        setTimeout(() => p.remove(), 30000);
    }

    setInterval(particle, 800);

    const idEl = document.getElementById("credentialsDisplay");
    const guideEl = document.getElementById("guidanceMessage");

    /* ---------- ROTATING MESSAGES (SAFE) ---------- */
    const messages = [
        "Keep your access credentials safe.",
        "Your session is unique per login.",
        "Do not share your AvalonFlow ID.",
        "Contact support with your session reference."
    ];

    let msgIndex = 0;

    function rotateMessages() {
        if (guideEl) {
            guideEl.style.opacity = 1;
            guideEl.textContent = messages[msgIndex];
            msgIndex = (msgIndex + 1) % messages.length;
        }
    }

    rotateMessages();
    setInterval(rotateMessages, 4000);

    /* ---------- SAFE ID REVEAL (NO BREAK UI) ---------- */
    const activeID = identity.id || urlID || "";

    if (idEl) {
        if (activeID) {
            idEl.classList.add("glitch");
            idEl.setAttribute("data-text", "🆔: " + activeID);
            idEl.textContent = "🆔: ";

            let i = 0;
            function revealID() {
                if (i <= activeID.length) {
                    idEl.textContent = "🆔: " + activeID.substring(0, i);
                    i++;
                    setTimeout(revealID, 70);
                } else {
                    setTimeout(() => {
                        idEl.classList.remove("glitch");
                    }, 500);
                }
            }
            revealID();
        } else {
            idEl.textContent = "🆔: ";
        }
    }

    /* ---------- SAFE SCAN SOUND (NO DRIFT SYNC) ---------- */
    let scanSound;

    function createScanSound() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();

        return function play() {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = "sine";
            osc.frequency.setValueAtTime(520, ctx.currentTime);

            gain.gain.setValueAtTime(0.0001, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.04, ctx.currentTime + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.18);
        };
    }

    document.addEventListener("click", () => {
        if (!scanSound) scanSound = createScanSound();
    }, { once: true });

    const SCAN_INTERVAL = 3800;

    document.addEventListener("click", () => {
        function loopScan() {
            if (scanSound) scanSound();
            setTimeout(loopScan, SCAN_INTERVAL);
        }
        setTimeout(loopScan, SCAN_INTERVAL);
    }, { once: true });

    /* ---------- Set Button Text Dynamically ---------- */  
    const btn = document.querySelector('[onclick="biometricLogin()"]');  
    if (btn) {  
        btn.innerText = DEVICE.isiOS ? "Login with Face/Touch ID" : "Login with Fingerprint";  
    }  
});

/* ---------- LOGIN FUNCTION (WHITELIST VALIDATED) ---------- */
function login() {
    const idInput = document.getElementById("AvalonFlowID") ? document.getElementById("AvalonFlowID").value.trim() : "";
    const storedIdentity = JSON.parse(localStorage.getItem("avalonflow_identity") || "{}");
    const activeID = storedIdentity.id || getIDFromURL();
    const errorEl = document.getElementById("loginError");

    if (!idInput) {
        if (errorEl) {
            errorEl.innerText = "Please use your personalized access link or contact support to retrieve your AvalonFlow ID";
        }
        return;
    }

    // Block authentication if ID is not in the whitelist
    if (activeApprovedIds.length > 0 && !activeApprovedIds.includes(idInput)) {
        if (errorEl) {
            errorEl.innerText = "Access details not recognized.";
        }
        return;
    }

    if (idInput === activeID) {
        const freshSessionRef = generateSession();

        localStorage.setItem("avalon_logged_in", "true");
        localStorage.setItem("avalonflow_identity", JSON.stringify({
            id: activeID,
            sessionRef: freshSessionRef
        }));

        window.location.replace(`https://membership.avalonflow.site/dashboard?ticket=${freshSessionRef}`);
    } else {
        if (errorEl) {
            errorEl.innerText = "Access details not recognized.";
        }
    }
}

/* ---------- Device Detection (UX tuning only) ---------- */    
const DEVICE = (() => {    
  const ua = navigator.userAgent || "";    
  return {    
    isAndroid: /Android/i.test(ua),    
    isiOS: /iPhone|iPad|iPod/i.test(ua),    
    isDesktop: !/Android|iPhone|iPad|iPod/i.test(ua)    
  };    
})();    

/* ---------- Biometric Limits ---------- */    
const BIOMETRIC_COOLDOWN = 60_000; // 1 minute    
const BIOMETRIC_MAX_TRIES = 3;    
const BIOMETRIC_TIMEOUT = DEVICE.isiOS ? 45_000 : 60_000; // 🔧 faster on iOS    

function biometricLocked() {    
  const lastFail = Number(localStorage.getItem("bio_last_fail") || 0);    
  return Date.now() - lastFail < BIOMETRIC_COOLDOWN;    
}    

function recordBiometricFail() {    
  const tries = Number(localStorage.getItem("bio_tries") || 0) + 1;    
  localStorage.setItem("bio_tries", tries);    
  localStorage.setItem("bio_last_fail", Date.now());    
}    

function resetBiometricFails() {    
  localStorage.removeItem("bio_tries");    
  localStorage.removeItem("bio_last_fail");    
}    

/* ---------- Biometric Login Improved ---------- */    
async function biometricLogin() {
  const identity = JSON.parse(localStorage.getItem("avalonflow_identity"));
  const errorEl = document.getElementById("loginError");

  if (!identity || !identity.id) {
    return fallbackLogin("No account found.");
  }

  // Enforce whitelist check on biometric authentication
  if (activeApprovedIds.length > 0 && !activeApprovedIds.includes(identity.id)) {
    if (errorEl) {
      errorEl.innerText = "Access details not recognized.";
    }
    return fallbackLogin("Access details not recognized.");
  }

  if (!window.PublicKeyCredential) {
    return fallbackLogin("Device security not supported.");
  }

  if (biometricLocked()) {
    return fallbackLogin("Too many attempts. Use fallback.");
  }

  try {
    if (localStorage.getItem("avalonflow_biometric_enabled") !== "true") {
      const credential = await navigator.credentials.create({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          rp: { name: "AvalonFlow", id: location.hostname },
          user: {
            id: crypto.getRandomValues(new Uint8Array(16)),
            name: "avalonflow-user",
            displayName: "AvalonFlow User"
          },
          pubKeyCredParams: [{ type: "public-key", alg: -7 }],
          authenticatorSelection: {
            authenticatorAttachment: "platform",
            userVerification: "required",
            residentKey: "required"
          },
          timeout: BIOMETRIC_TIMEOUT
        }
      });

      if (credential) {
        localStorage.setItem("avalonflow_biometric_enabled", "true");
      } else {
        return fallbackLogin("Device registration failed.");
      }
    }

    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        userVerification: "required",
        timeout: BIOMETRIC_TIMEOUT
      }
    });

    if (!assertion) {
      return fallbackLogin("Authentication failed.");
    }

    resetBiometricFails();

    localStorage.setItem("avalon_logged_in", "true");
    window.location.replace(`https://membership.avalonflow.site/dashboard?ticket=${identity.sessionRef}`);

  } catch (err) {
    recordBiometricFail();

    if (Number(localStorage.getItem("bio_tries")) >= BIOMETRIC_MAX_TRIES) {
      fallbackLogin("Biometric locked. Use fallback.");
    } else {
      fallbackLogin("Authentication cancelled or failed.");
    }
  }
}    

/* ---------- Fallback ---------- */  
function fallbackLogin(message) {  
  if (message) alert(message);  
  document.body.classList.add("show-fallback");  
}
